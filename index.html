<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Rock Paper Scissors</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #ec4899;
            --dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .score-box {
            display: flex;
            flex-direction: column;
        }

        .score-box span.label {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .score-box span.score {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .battle-arena {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            min-height: 120px;
        }

        .move-display {
            font-size: 4rem;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            border: 1px dashed rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }

        .vs {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--text-muted);
        }

        .result-text {
            font-size: 1.5rem;
            font-weight: 600;
            height: 35px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .win { color: #4ade80; }
        .lose { color: #f87171; }
        .tie { color: #fbbf24; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button.move-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 2.5rem;
            width: 80px;
            height: 80px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button.move-btn:hover {
            transform: translateY(-5px) scale(1.1);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }

        button.move-btn:active {
            transform: scale(0.95);
        }
        
        .loading {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .bg-blob {
            position: absolute;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.5;
            animation: float 10s infinite ease-in-out alternate;
        }

        .blob-1 {
            background: var(--primary);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            background: var(--secondary);
            width: 400px;
            height: 400px;
            border-radius: 50%;
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(30px, 50px) rotate(20deg); }
        }
    </style>
</head>
<body>

    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="glass-panel">
        <h1>AI Showdown</h1>
        <p class="subtitle">Can you outsmart the Neural Network?</p>

        <div class="score-board">
            <div class="score-box">
                <span class="label">You</span>
                <span class="score" id="score-you">0</span>
            </div>
            <div class="score-box">
                <span class="label">Ties</span>
                <span class="score" id="score-ties" style="font-size: 1.5rem; color: var(--text-muted); margin-top:10px;">0</span>
            </div>
            <div class="score-box">
                <span class="label">AI</span>
                <span class="score" id="score-ai">0</span>
            </div>
        </div>

        <div class="battle-arena">
            <div class="move-display" id="display-you">?</div>
            <div class="vs">VS</div>
            <div class="move-display" id="display-ai">?</div>
        </div>

        <div class="result-text" id="result-text">Make your move!</div>

        <div class="controls">
            <button class="move-btn" onclick="playMove('R')" title="Rock">🪨</button>
            <button class="move-btn" onclick="playMove('P')" title="Paper">📄</button>
            <button class="move-btn" onclick="playMove('S')" title="Scissors">✂️</button>
        </div>
    </div>

    <script>
        const emojiMap = {
            'R': '🪨',
            'P': '📄',
            'S': '✂️',
            '': '?'
        };

        let scoreYou = 0;
        let scoreAI = 0;
        let scoreTies = 0;

        async function playMove(userMove) {
            const displayYou = document.getElementById('display-you');
            const displayAI = document.getElementById('display-ai');
            const resultText = document.getElementById('result-text');

            // Reset UI
            displayYou.innerHTML = emojiMap[userMove];
            displayAI.innerHTML = '🤖';
            displayAI.classList.add('loading');
            resultText.innerHTML = 'AI is thinking...';
            resultText.className = 'result-text';

            try {
                // Send move to python API
                const response = await fetch('/api/play', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ move: userMove })
                });

                if (!response.ok) throw new Error("API Error");

                const data = await response.json();
                const aiMove = data.ai_move;

                displayAI.classList.remove('loading');
                displayAI.innerHTML = emojiMap[aiMove];

                calculateResult(userMove, aiMove);

            } catch (error) {
                console.error(error);
                displayAI.classList.remove('loading');
                displayAI.innerHTML = '❌';
                resultText.innerHTML = 'Error connecting to API';
                resultText.className = 'result-text lose';
            }
        }

        function calculateResult(userMove, aiMove) {
            const resultText = document.getElementById('result-text');
            
            if (userMove === aiMove) {
                scoreTies++;
                document.getElementById('score-ties').innerText = scoreTies;
                resultText.innerHTML = "It's a Tie!";
                resultText.className = 'result-text tie';
            } else if (
                (userMove === 'R' && aiMove === 'S') ||
                (userMove === 'P' && aiMove === 'R') ||
                (userMove === 'S' && aiMove === 'P')
            ) {
                scoreYou++;
                document.getElementById('score-you').innerText = scoreYou;
                resultText.innerHTML = 'You Win! 🎉';
                resultText.className = 'result-text win';
            } else {
                scoreAI++;
                document.getElementById('score-ai').innerText = scoreAI;
                resultText.innerHTML = 'AI Wins! 🤖';
                resultText.className = 'result-text lose';
            }
        }
    </script>
</body>
</html>
